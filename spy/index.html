<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f0e">
<title>Albion House — Spy Agency Prototype</title>

<link rel="stylesheet" href="spy.css">
</head>
<body>
  <div id="app">
    <header id="hud" class="hud hidden">
      <div class="clockcol"><div class="clock"><span id="clock">08:00</span><small>Day 1</small></div><button id="mute" class="mute" aria-label="Sound on or off" title="Sound"></button></div>
      <div id="meters" class="meters"></div>
    </header>
    <div id="ticker" class="ticker hidden"><span class="tk-tag">LATE EDITION</span><div class="tk-win"><div id="tk-run" class="tk-run"></div></div></div>
    <main id="view" class="view"></main>
    <footer id="hintbar" class="hintbar hidden"><span class="dot"></span><span id="hint"></span></footer>
  </div>
  <script src="data.js"></script>
  <script src="feel.js"></script>
  <script src="audio.js"></script>
  <script src="spy.js"></script>
  <script src="day2.js"></script>
</body>
</html>
