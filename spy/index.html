<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f0e">
<title>Albion House — Spy Agency Prototype</title>

<link rel="stylesheet" href="spy.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <filter id="ink" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" result="d"/><feComponentTransfer in="n" result="m"><feFuncA type="discrete" tableValues="1 1 1 0 1 1 0 1"/></feComponentTransfer><feComposite in="d" in2="m" operator="in"/></filter>
  </defs></svg>
  <div id="night" aria-hidden="true"></div>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div id="app">
    <header id="hud" class="hud hidden">
      <div class="clockcol"><div class="clock"><span id="clock">08:00</span><small>Day 1</small></div><button id="mute" class="mute" aria-label="Sound on or off" title="Sound"></button></div>
      <div id="meters" class="meters"></div>
    </header>
    <div id="ticker" class="ticker hidden"><span class="tk-tag">LATE EDITION</span><div class="tk-win"><div id="tk-run" class="tk-run"></div></div></div>
    <main id="view" class="view"></main>
    <footer id="hintbar" class="hintbar hidden"><span class="dot"></span><span id="hint"></span></footer>
  </div>
  <div id="grain" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>
  <script src="data.js"></script>
  <script src="feel.js"></script>
  <script src="look.js"></script>
  <script src="audio.js"></script>
  <script src="voice.js"></script>
  <script src="desk.js"></script>
  <script src="cine.js"></script>
  <script src="spy.js"></script>
  <script src="day2.js"></script>
  <script src="day3.js"></script>
</body>
</html>
