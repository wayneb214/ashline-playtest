<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Quiet Hours — Spy Agency Prototype</title>
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="spy.css">
</head>
<body>
  <div id="app">
    <header id="hud" class="hud hidden">
      <div class="clock"><span id="clock">08:00</span><small>Day 1</small></div>
      <div id="meters" class="meters"></div>
    </header>
    <div id="ticker" class="ticker hidden"><span class="tk-tag">NEWS</span><div class="tk-win"><div id="tk-run" class="tk-run"></div></div></div>
    <main id="view" class="view"></main>
    <footer id="hintbar" class="hintbar hidden"><span class="dot"></span><span id="hint"></span></footer>
  </div>
  <script src="../js/data.js"></script>
  <script src="spy.js"></script>
</body>
</html>
