# Codemagic cloud build for Albion House: Spymaster.
# The file must stay at the repository root. Codemagic discovers only
# codemagic.yaml in that location. The native project is albion-ios/,
# selected below with working_directory. Do not point the Codemagic app
# at albion-ios/codemagic.yaml; that file is not used.
#
# Signing uses an App Store Connect API key integration plus
# CERTIFICATE_PRIVATE_KEY in the code_signing variable group. The CLI
# creates or reuses the Apple Distribution certificate and the App Store
# profile. Nothing is uploaded to Codemagic's "Code signing identities"
# by this file.
#
# This workflow does not start itself. Run it by hand from the Codemagic
# UI after albion-ios/docs/app-store-readiness.md. A successful run builds
# an IPA and sends it to TestFlight.
#
# Bundle id io.github.wayneb214.albionhouse is registered.
# App Store Connect Apple ID for this app is 6832206818.
# Do not reuse another app's bundle id, Apple ID, or integration name.
workflows:
  ios-testflight:
    name: Albion House iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    # npm, tests, and cap sync run here. Paths below are relative to this
    # directory unless they start with $CM_BUILD_DIR (the repository root).
    working_directory: albion-ios
    integrations:
      # Create a team integration with this exact name. It is not another app's key.
      app_store_connect: Albion House App Store Connect key
    environment:
      node: 22
      xcode: latest
      groups:
        - code_signing
      vars:
        # Relative to working_directory (albion-ios).
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: io.github.wayneb214.albionhouse
        APP_STORE_APPLE_ID: "6832206818"
    scripts:
      - name: Install
        script: npm ci
      - name: Unit tests
        script: npm test
      - name: Build the game and copy it into the iOS project
        script: npm run ios:sync
      - name: Check the signing key is set
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is missing."
            echo "Add it to the code_signing variable group. It is the Apple Distribution certificate private key (PEM), not a password and not another app's bundle id."
            echo "See albion-ios/docs/app-store-readiness.md."
            exit 1
          fi
      - name: Set up a keychain for code signing
        script: keychain initialize
      - name: Check the bundle id and App Store id are this app's
        script: |
          if [ "$BUNDLE_ID" != "io.github.wayneb214.albionhouse" ]; then
            echo "BUNDLE_ID must be io.github.wayneb214.albionhouse."
            echo "That id is registered for Albion House. Refusing to sign a different app."
            echo "Current value: ${BUNDLE_ID:-<empty>}"
            exit 1
          fi
          if [ "$APP_STORE_APPLE_ID" != "6832206818" ]; then
            echo "APP_STORE_APPLE_ID must be 6832206818, the Albion House record in App Store Connect."
            echo "Do not substitute another app's Apple ID."
            echo "Current value: ${APP_STORE_APPLE_ID:-<empty>}"
            exit 1
          fi
      - name: Fetch or create the distribution certificate and App Store profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create
      - name: Add the certificate to the keychain
        script: keychain add-certificates
      - name: Use the profile in the Xcode project
        script: xcode-project use-profiles
      - name: Build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$((LATEST + 1))
          perl -pi -e "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" \
            "$CM_BUILD_DIR/albion-ios/$XCODE_PROJECT/project.pbxproj"
          echo "Build number $NEXT"
      - name: Build the .ipa
        script: |
          # Default ipa output is build/ios/ipa relative to the working directory.
          # Pin it to an absolute path so the artifact glob below matches.
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/albion-ios/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_DIR/albion-ios/build/ios/ipa"
    artifacts:
      # Artifact paths are relative to the repository root, not working_directory.
      - albion-ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
